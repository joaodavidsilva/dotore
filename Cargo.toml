[workspace]
members = ["crates/dotore-core", "crates/dotore-rs"]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Correctness & safety
unwrap_used = "deny"
expect_used = "warn"
wildcard_enum_match_arm = "warn"
dbg_macro = "deny"
todo = "warn"

# Pragmatic size gates (favor readable, idiomatic Rust over artificial splitting)
too_many_lines = "allow"
cognitive_complexity = "allow"
excessive_nesting = "warn"
too_many_arguments = "warn"

# Suppression hygiene: require #[expect(..., reason = "...")] over #[allow(...)]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "dotore"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust React and TypeScript static analyzer, deterministic auto-fixer, and remediation engine."
license = "MIT"

[lib]
name = "dotore"
path = "src/lib.rs"

[[bin]]
name = "dotore"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dotore-core = { path = "crates/dotore-core" }
dotore-rs = { path = "crates/dotore-rs" }
ignore = "0.4"
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
