[package]
name = "dotore"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust React doctor starting with Effect & State dataflow diagnostics, surgical auto-fixes, and visual cascade reports."
license = "MIT"

[lib]
name = "dotore"
path = "src/lib.rs"

[[bin]]
name = "dotore"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_parser = "0.155.0"
oxc_semantic = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
# Correctness & safety
unwrap_used = "deny"
expect_used = "warn"
wildcard_enum_match_arm = "warn"
dbg_macro = "deny"
todo = "warn"

# Size & complexity gates
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"

# Suppression hygiene: require #[expect(..., reason = "...")] over #[allow(...)]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
